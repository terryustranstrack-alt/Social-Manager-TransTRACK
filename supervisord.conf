[supervisord]
nodaemon=true
logfile=/var/log/supervisord/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisord

[program:laravel]
command=php artisan serve --host=0.0.0.0 --port=9000
directory=/var/www
autostart=true
autorestart=true
user=www
stdout_logfile=/var/log/supervisord/laravel.log
stderr_logfile=/var/log/supervisord/laravel_error.log
stopasgroup=true
killasgroup=true

# Assets are compiled at image build time (`npm run build` in the Dockerfile).
# A Vite dev server is deliberately NOT started here: it is a development-only
# process, it would recompile on request, and it must never run in production.
# Any future change to Blade/CSS has to produce a new image, not a hot reload.

[program:laravel-queue-worker]
command=php artisan queue:work --sleep=3 --tries=3 --timeout=180 --max-time=3600
directory=/var/www
autostart=true
autorestart=true
user=www
stdout_logfile=/var/log/supervisord/queue-worker.log
stderr_logfile=/var/log/supervisord/queue-worker_error.log
stopasgroup=true
killasgroup=true
