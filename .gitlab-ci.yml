stages:
  - build
  - test
  - publish
  - release
  - database
  - optimize

default:
  tags:
    - build-gcp

variables:
  CONTAINER_REGISTRY: ${CI_REGISTRY_IMAGE}/application

# This repository shipped for months containing configuration files only: the
# entire application source (app/, routes/, bootstrap/, ...) had never been
# committed. Nothing in the pipeline noticed, because `docker build` was only
# ever run for tags and no stage verified that an application actually exists.
# This job fails fast on any commit that cannot possibly boot Laravel.
verify-application-present:
  stage: build
  script:
    - |
      missing=0
      for p in app bootstrap/app.php config routes database resources public/index.php; do
        if [ ! -e "$p" ]; then
          echo "MISSING: $p"
          missing=1
        fi
      done
      if [ -z "$(ls -A app 2>/dev/null)" ]; then
        echo "MISSING: app/ exists but contains no PHP files"
        missing=1
      fi
      if [ "$missing" -ne 0 ]; then
        echo "::error::This commit contains no runnable Laravel application. The Dockerfile runs 'php artisan storage:link' and 'npm run build', both of which will fail."
        exit 1
      fi
      echo "Application source present."

build:
  stage: build
  needs:
    - verify-application-present
  script:
    - cp .env.example .env
    - docker build -t $CONTAINER_REGISTRY:${CI_COMMIT_TAG} -t $CONTAINER_REGISTRY:latest -f Dockerfile .
  except:
    - branches
  artifacts:
    paths:
      - .env
    expire_in: 1 days
    when: always

automation-test:
  stage: test
  dependencies:
    - build
  script:
    - echo run tests in this section
  except:
    - branches

vulnerabilities-test:
  stage: test
  dependencies:
    - build
  script:
    - echo run tests in this section
  except:
    - branches

publish:
  stage: publish
  dependencies:
    - automation-test
    - vulnerabilities-test
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker push $CONTAINER_REGISTRY:${CI_COMMIT_TAG}
    - docker push $CONTAINER_REGISTRY:latest
  except:
    - branches
  artifacts:
    paths:
      - .env
    expire_in: 1 days
    when: always

production:
  stage: release
  dependencies:
    - publish
  variables:
    GIT_STRATEGY: none
    ENVI: production
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - echo "$ENV_RELEASE" > "$(pwd)/.env"
    - echo "$SUPERVISOR" > "$(pwd)/supervisord.conf"
    - echo "$NOTIFIER" > "$(pwd)/notifier.sh"
    - echo "$DOCKER_COMPOSE_NGINX" | base64 --decode > "$(pwd)/docker-compose.yml"
    - docker compose pull application && docker compose up -d --force-recreate
    - docker compose ps -q application
    - docker image prune -f
    # - bash notifier.sh
  tags:
    - production-gcp
  only:
    - /^([A-Za-z0-9.-]+)$/
  except:
    - branches
  artifacts:
    paths:
      - .env
      - docker-compose.yml
    expire_in: 1 days
    when: always

production-migration:
  stage: database
  variables:
    GIT_STRATEGY: none
  dependencies:
    - production
  script:
    - docker compose exec -T --user root application sh -lc 'php artisan config:clear && php artisan migrate --force'
  tags:
    - production-gcp
  only:
    - /^([A-Za-z0-9.-]+)$/
  except:
    - branches
  artifacts:
    paths:
      - .env
      #- storage/firebase-admin-sdk.json
    expire_in: 1 days
    when: always
  needs:
    - job: production

production-optimize:
  stage: optimize
  variables:
    GIT_STRATEGY: none
  dependencies:
    - production-migration
  script:
    # No `|| true`: a failed `optimize` means the container is serving with a
    # stale or partially built config cache, and that must fail the deploy
    # loudly instead of being reported as success.
    - docker compose exec -T --user root application php artisan optimize
    # Long-lived queue workers keep executing the PREVIOUS release until they
    # are told to exit. Without this, scheduled posts are published by old code
    # while the web tier already serves the new release.
    - docker compose exec -T --user root application php artisan queue:restart
  tags:
    - production-gcp
  only:
    - /^([A-Za-z0-9.-]+)$/
  except:
    - branches
  artifacts:
    paths:
      - .env
      #- storage/firebase-admin-sdk.json
    expire_in: 1 days
    when: always
  needs:
    - job: production-migration